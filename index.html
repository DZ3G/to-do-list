<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma liste de tâches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- En-tête -->
        <h1>Ma Liste de Tâches</h1>

        <!-- Formulaire pour ajouter une tâche -->
        <div class="form-section">
            <input 
                type="text" 
                id="inputTache" 
                placeholder="Entrez une nouvelle tâche..."
            >
            <button id="btnAjouter">Ajouter</button>
        </div>

        <!-- Liste des tâches -->
        <ul id="listeTaches" class="liste-taches">
            <!-- Les tâches vont s'afficher ici -->
        </ul>

        <!-- Message si pas de tâches -->
        <p id="messageVide" class="message-vide">Aucune tâche pour le moment</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
